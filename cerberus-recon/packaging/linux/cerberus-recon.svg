<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cerberus shield">
  <defs>
    <radialGradient id="cerb-core" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#f06b5a"/>
      <stop offset="55%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#4a0f0f"/>
    </radialGradient>
  </defs>
  <!-- Shield body -->
  <path d="M32 3 L56 11 V30 C56 45 46 55 32 61 C18 55 8 45 8 30 V11 Z"
        fill="#0d0d0f" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Three heads: center + two flanks -->
  <g>
    <!-- center head -->
    <path d="M32 20 c-4 0 -6.5 3 -6.5 7 c0 3.4 2.2 6.3 6.5 9 c4.3 -2.7 6.5 -5.6 6.5 -9 c0 -4 -2.5 -7 -6.5 -7 z" fill="url(#cerb-core)"/>
    <circle cx="29.4" cy="26.2" r="1.1" fill="#0d0d0f"/>
    <circle cx="34.6" cy="26.2" r="1.1" fill="#0d0d0f"/>
    <!-- left head -->
    <path d="M20 26 c-3 0 -5 2.3 -5 5.4 c0 2.6 1.7 4.8 5 6.9 c1.9 -1.2 3.2 -2.5 4 -3.9 c-1.4 -1.6 -2.2 -3.6 -2.2 -5.8 c0 -1 .13 -1.9 .38 -2.6 z" fill="#c0392b" opacity="0.7"/>
    <!-- right head -->
    <path d="M44 26 c3 0 5 2.3 5 5.4 c0 2.6 -1.7 4.8 -5 6.9 c-1.9 -1.2 -3.2 -2.5 -4 -3.9 c1.4 -1.6 2.2 -3.6 2.2 -5.8 c0 -1 -.13 -1.9 -.38 -2.6 z" fill="#c0392b" opacity="0.7"/>
  </g>
  <!-- Divider spark -->
  <path d="M32 40 L32 50" stroke="#c0392b" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
</svg>
