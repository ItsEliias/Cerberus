<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
  <title>Cerberus Recon</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <!-- Brand corner -->
    <div class="brand">
      <img src="glyph.svg" alt="" width="26" height="26" />
      <div>
        <div class="wordmark"><span class="hud-bracket">[</span><span class="hud-lead">C</span><span class="hud-bracket">]</span>ERBERUS</div>
        <div class="wordmark-sub">RECON</div>
      </div>
    </div>

    <!-- Topbar -->
    <div class="topbar">
      <div class="chips">
        <span class="hud-chip"><span class="cdot auth"></span>Authorized only</span>
        <span class="hud-chip"><span class="cdot scope"></span><b id="scope-in">0</b>&nbsp;in&nbsp;/&nbsp;<b id="scope-count">0</b>&nbsp;scope</span>
        <span class="hud-chip" id="workdir-chip" title="Working directory"><span class="cdot"></span><span id="workdir-name">no workdir</span></span>
      </div>
      <div class="spacer"></div>
      <button id="btn-workdir">Workdir</button>
      <button id="btn-restart" class="primary">Restart session</button>
    </div>

    <!-- Left tab rail -->
    <nav class="nav">
      <button class="nav-item active" data-view="scope">
        <span class="nav-ico"><i>◈</i></span><span class="nav-lbl">Scope</span><span class="nav-badge" id="nav-scope">0</span>
      </button>
      <button class="nav-item" data-view="findings">
        <span class="nav-ico"><i>❯</i></span><span class="nav-lbl">Findings</span><span class="nav-badge" id="nav-findings">0</span>
      </button>
      <button class="nav-item" data-view="sessions">
        <span class="nav-ico"><i>≡</i></span><span class="nav-lbl">Sessions</span><span class="nav-badge" id="nav-sessions">0</span>
      </button>
    </nav>

    <!-- Main = swappable view (top) + docked terminal (bottom) -->
    <main class="main">
      <section class="view">
        <!-- SCOPE -->
        <div class="view-panel" data-panel="scope">
          <div class="panel-head">
            <span class="hud-label">Target Scope</span>
            <div class="spacer"></div>
            <button id="add-target" class="primary">Add target</button>
          </div>
          <div id="scope-list"></div>
        </div>

        <!-- FINDINGS -->
        <div class="view-panel" data-panel="findings" hidden>
          <div class="panel-head">
            <span class="hud-label">Findings Log</span>
            <span class="badge status" id="finding-total">0 logged</span>
            <div class="spacer"></div>
            <button id="add-finding" class="primary">Log finding</button>
          </div>
          <div class="watch-note" id="watch-note"></div>
          <div id="findings-list"></div>
        </div>

        <!-- SESSIONS -->
        <div class="view-panel" data-panel="sessions" hidden>
          <div class="panel-head">
            <span class="hud-label">Session History</span>
            <div class="spacer"></div>
          </div>
          <div id="session-list"></div>
        </div>
      </section>

      <div class="resizer" id="resizer"></div>

      <section class="term-wrap">
        <div class="term-bar">
          <span class="live"><span class="dot out" id="term-dot"></span><span id="term-status">idle</span></span>
          <span class="spacer"></span>
          <span class="cmd" id="term-cmd">claude</span>
        </div>
        <div id="terminal"></div>
      </section>
    </main>
  </div>

  <div class="modal-back" id="modal-back"><div class="modal" id="modal"></div></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
