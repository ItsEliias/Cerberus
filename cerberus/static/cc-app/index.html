<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/cc-app/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CERBERUS — Command Center</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg, #060708); }
      #cc-root { width: 100%; height: 100vh; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="cc-root"></div>
    <script type="module">
      // Apply theme colors to this iframe's documentElement.
      // CSS custom properties don't cross iframe boundaries, so we must
      // re-apply them here from localStorage (same origin = same storage)
      // and update them in real-time via postMessage from the parent frame.
      function _applyTheme(c) {
        const s = document.documentElement.style;
        if (c.bg)     s.setProperty('--bg',             c.bg);
        if (c.fg)     s.setProperty('--fg',             c.fg);
        if (c.panel)  s.setProperty('--panel',          c.panel);
        if (c.border) s.setProperty('--border',         c.border);
        if (c.red) {
          s.setProperty('--red',             c.red);
          s.setProperty('--cc-crimson',      c.red);
          s.setProperty('--cc-crimson-glow', `color-mix(in srgb,${c.red} 40%,transparent)`);
          s.setProperty('--cc-crimson-hot',  `color-mix(in srgb,${c.red} 85%,white)`);
          // Animation tokens — derived locally if not provided in payload
          const r = c.red;
          const fg = c.fg || '#c5c9d0';
          const border = c.border || '#3a2a2a';
          s.setProperty('--glow',        c.glow       || `color-mix(in srgb,${r} 25%,transparent)`);
          s.setProperty('--grid-line',   c.gridLine   || `color-mix(in srgb,${border} 30%,transparent)`);
          s.setProperty('--particle',    c.particle   || `color-mix(in srgb,${fg} 55%,transparent)`);
          s.setProperty('--globe-wire',  c.globeWire  || `color-mix(in srgb,${r} 35%,transparent)`);
          s.setProperty('--globe-atmo',  c.globeAtmo  || `color-mix(in srgb,${r} 60%,transparent)`);
        }
      }

      // Seed from localStorage (same origin as the parent page)
      const _DEFAULT = { bg:'#1a1d23', fg:'#c5c9d0', panel:'#111111', border:'#3a2a2a', red:'#c0392b' };
      try {
        const saved = JSON.parse(localStorage.getItem('cerberus-theme'));
        _applyTheme((saved && saved.colors) ? saved.colors : _DEFAULT);
      } catch (_) { _applyTheme(_DEFAULT); }

      // Real-time updates — parent calls postMessage whenever applyColors() runs
      window.addEventListener('message', (e) => {
        if (e.origin !== location.origin) return;
        if (e.data && e.data.type === 'cerberus-theme') _applyTheme(e.data.colors);
      });

      // Bootstrap the Command Center module
      window.CYBER_APPS_REGISTRY = [];
      window.JX = window.JX || {};

      const { init } = await import('/static/js/cyberapps/command-center/index.js');
      init(document.getElementById('cc-root'), {});
    </script>
  </body>
</html>
