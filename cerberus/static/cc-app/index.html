<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/cc-app/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CERBERUS — Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Phase C: vanilla JS command center (replaces deleted React bundle) -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #060708; }
      #cc-root { width: 100%; height: 100vh; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="cc-root"></div>
    <script type="module">
      // Bootstrap: mount the command-center module into #cc-root
      // Provide the CYBER_APPS_REGISTRY stub so index.js self-registers cleanly
      window.CYBER_APPS_REGISTRY = [];

      // JX stubs (effects.js functions referenced in existing code)
      window.JX = window.JX || {};

      // Pass Cerberus CSS variables through — match the parent frame palette
      document.documentElement.style.setProperty('--bg',     '#1a1d23');
      document.documentElement.style.setProperty('--fg',     '#c5c9d0');
      document.documentElement.style.setProperty('--red',    '#c0392b');
      document.documentElement.style.setProperty('--border', '#3a2a2a');

      const { init } = await import('/static/js/cyberapps/command-center/index.js');
      const root = document.getElementById('cc-root');
      init(root, {});
    </script>
  </body>
</html>
